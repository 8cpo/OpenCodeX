name: publish-ghcr

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: false
        default: latest
  push:
    branches:
      - dev
    paths:
      - Dockerfile
      - .github/workflows/publish-ghcr.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/8cpo/opencodex:${{ github.event.inputs.tag || 'latest' }}
          labels: |
            org.opencontainers.image.source=https://github.com/8cpo/OpenCodeX
            org.opencontainers.image.revision=${{ github.sha }}
